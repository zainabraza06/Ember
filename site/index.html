ts, in normal gravity testing will continue. These tests will involve gaseous, liquid, and solid fuels. These experiments will further establish the validation of the BRE for 1-g applications and show its usefulness to establish 1-g ignition and extinction limits. As available, drop facility testing will be used to refine procedures, test instrumentation, and help to establish viable flow conditions.\n\nWe will also pursue a CFD model for the quiescent microgravity burning. This will also guide us in the flight experiments, and potentially provide a predictive methodology.", "conditions_varied": "Table: burner size (25 mm in row 1), fuel bottle, O2 % (values such as 21; 26.5; 34; 40), flames ignited per day. Notes state chamber pressure was varied but is NOT in the table. Objectives text names 14.7 psia/21%, 10.2 psia/26.5%, 8.2 psia/34% O2", "outcomes_measured": "Number of flames ignited per day; burning behavior per objectives text", "known_problems": "Pressure per test not in table.", "hardware": "ACME / CIR", "hardware_basis": "official: ACME is six experiments with gaseous fuels in the Combustion Integrated Rack (CIR)", "tags": [{"tag": "prevention", "reason": "official Potential Considerations: BRE studies materials flammability in still atmospheres as a function of material properties"}], "table_type": "summary_per_day", "approx_tests": "18 test-day rows; sum of \"Flames Ignited\" = 194 (our sum, not stated by PSI)", "material_class": "gas fuel burner (100% C2H4 in rows read)", "table_files": ["PSI-20_Experimental table_ACME BRE.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/vb93-3y72; 16 publications listed; 0 files marked removed in version history (reason not stated). Pressure per test not in table."}, {"id": "PSI-21", "title": "Advanced Combustion via Microgravity Experiments / Coflow Laminar Diffusion Flame", "acronym": "ACME CLD Flame", "platform": "ISS: CIR/ACME", "license": "CC0-1.0", "doi": "10.60555/23e1-9950", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-21", "objective": "In order to provide the experimental data needed to allow rigorous testing of computational models at the extremes of the fuel dilution spectrum, we have the following objectives:\nA) Characterize the behavior of weak coflow diffusion flames of methane and ethylene, as a function of velocity and fuel dilution, through measurement of flame shape, lift-off heights, temperatures and extinction limits.\nB) Characterize the sooting tendencies of diffusion flames with long residence times, as a function of velocity and fuel dilution, through measurement of flame shape, gas temperatures in the soot-free portion of the flame, soot luminosity, soot temperatures, and soot volume fractions.", "approach": "ACME CLD Flame project goals include the generation of improved computational models with improved soot sub-models that are effective for both dilute flames and sooting flames that vary from low to high soot loading levels. The enhanced time and spatial scales in a microgravity environment will be important for achieving both goals. Experimentally, we plan to study methane and ethylene diffusion flames over a wide range of test conditions. For the more dilute flames, measurements will be made of flame chemiluminesence of OH* and CH* to observe variations in lift-off height and flame shape as extinction limits are approached. The sooting tendencies of the more fuel-rich flames will be investigated using soot luminosity and laser extinction measurements to determine soot temperatures and soot volume fractions. Flame temperatures in non-sooting regions will be measured using thin-filament pyrometry. Based on observations, modifications can be made to the kinetics and soot model to match better the experimental results. If the overall agreement of the measurements and computations is good, the results of the computations can be “mined” to provide insight on species (and hence chemical processes) that cannot be measured directly using the diagnostics available for the proposed experiment.", "conditions_varied": "Table: test type, test day, fuel and N2 mass-flow-controller max, fuel bottle, fuel concentration range, flames ignited", "outcomes_measured": "Flames ignited per day; shape, lift-off, extinction limits per objectives text", "known_problems": "Row 2 fuel bottle reads \"40% CH5\" (apparent typo for CH4); not corrected.", "hardware": "ACME / CIR", "hardware_basis": "official: ACME is six experiments with gaseous fuels in the Combustion Integrated Rack (CIR)", "tags": [], "table_type": "summary_per_day", "approx_tests": "32 test-day rows; sum of \"Flames ignited\" = 344 (our sum)", "material_class": "gas fuel (methane/ethylene, N2 diluted)", "table_files": ["PSI-21_Experimental table_CLD Flame.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/23e1-9950; 18 publications listed; 0 files marked removed in version history (reason not stated). Row 2 fuel bottle reads \"40% CH5\" (apparent typo for CH4); not corrected."}, {"id": "PSI-22", "title": "Advanced Combustion via Microgravity Experiments Electric-Field Effects on Laminar Diffusion Flames", "acronym": "ACME E-FIELD Flames", "platform": "ISS: CIR/ACME", "license": "CC0-1.0", "doi": "10.60555/se5a-8c73", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-22", "objective": "The objective of this investigation is to better understand the relationship between electric field voltage and chemi-ion current, analyze the dynamic response of flames to electric field changes, evaluate soot formation, and characterize stabilized near-limit lifted flames.", "approach": "The E-FIELD flames experiment investigates how electric fields influence the behavior of laminar diffusion flames in microgravity. This unique environment is ideal for isolating electric field effects from buoyancy forces.\nThe experiment is conducted with gas-fueled flames, both with and without a coflow of air. In the former case, the test  mm thick, 1 cm wide", "5 mm thick, 2 cm wide", "candle", "fabric", "fabric, size text \"1 cm\"", "fabric, size text \"2 cm\"", "rod 12.7 mm diameter", "rod 6.35 mm diameter", "rod 9.525 mm diameter", "sphere 4 cm (diameter assumed from size text)"], "sizes": {"thickness mm": "0.1 to 5", "width cm": "1 to 2"}, "outcomes": {"unknown": 129}, "source_refs": ["data/raw/psi/PSI-25/PSI-25_Experimental table_BASS-II.csv"]}, "catalog_notes": "DOI 10.60555/4qc4-de67; 17 publications listed; 131 files marked removed in version history (reason not stated). Flow velocity is not given numerically; fan/restrictor settings are codes."}, {"id": "PSI-26", "title": "Burning and Suppression of Solids", "acronym": "BASS", "platform": "ISS: Microgravity Science Glovebox", "license": "CC0-1.0", "doi": "10.60555/58h4-dy80", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-26", "objective": "The two main objectives for BASS are to:\n    1.) Begin to bridge the gap between the normal gravity NASA-STD-6001 Test#1 method, ground-based microgravity tests, and actual material flammability in microgravity. The relation between these can be investigated by observing flames burning for the longer times available in flight. Practical, realistic (thicker) fuels in typical geometries will be examined, including wake flames which have characteristics of a fire burning behind another object (for example, a fire burning in tight area which may not be easily accessible).\n    2.) Assess the effectiveness of an inert, gaseous extinguishing agent (similar to that used on ISS) in putting out flames over different materials, geometries, preheating, and flow.", "approach": "The experiment was conducted aboard the International Space Station (ISS) inside the Microgravity Glove Box (MSG). Custom-made fabric samples consisting of 75% cotton and 25% fiberglass (by mass) measuring were used as a fuel source as well as Nomex fabric and Ultem. A Kanthal wire (29-gage)igniter was used to initiate combustion at one end of the fabric. Airflow was controlled using a variable speed fan, with airflow speeds reaching as high as 40 cm/s. The airflow was directed along the fuel surface in either the opposed or concurrent direction.\n\nThis investigation explored two primary air flow configurations; concurrent-flow and opposed-flow. With concurrent-flow air flows in the same direction as the flame spread and in opposed-flow air flows in the opposite direction of flame spread. Flames were observed in the top and edge profiles and data was collected on flame size, shape, color, spread rate, and potential flame quenching. The samples were placed in a small flow duct (76 mm x 76 mm cross section) that allowed for airflow across the fabric. Other sample shapes were utilized as well including spheres and cylinders.", "conditions_varied": "Table has only date, GMT, test numbers, sample number and fuel sample material; no O2/pressure/flow columns", "outcomes_measured": "None in table", "known_problems": "Material names inconsistent (e.g. \"PMMA 2 cm\", \"pmma 2 cm\", \"PMMA sphere 2 cm\").", "hardware": "MSG flow duct", "hardware_basis": "official: BASS, BASS-II, SPICE and SLICE use the Microgravity Science Glovebox (MSG); fan-driven flow duct built for SPICE", "tags": [{"tag": "prevention", "reason": "official Background: solid materials were studied in BASS, BASS-II, Saffire-I, -II, -III"}], "table_type": "per_test_minimal", "approx_tests": "122 rows", "material_class": "solid: SIBAL, PMMA spheres/cylinders, Nomex blend, wax candle (names inconsistent)", "table_files": ["PSI-26_Experimental table_BASS.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/58h4-dy80; 10 publications listed; 24 files marked removed in version history (reason not stated). Material names inconsistent (e.g. \"PMMA 2 cm\", \"pmma 2 cm\", \"PMMA sphere 2 cm\"). | M2 decision D13: removed from the structured test table; evidence ledger (M3) only."}, {"id": "PSI-39", "title": "Cool Flames Investigation", "acronym": "CFI", "platform": "ISS: CIR/MDCA", "license": "CC0-1.0", "doi": "10.60555/m6pj-a914", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-39", "objective": "The objectives of this investigation are to:\n    1) Examine the combustion behavior of n-dodecane and mixtures of n-dodecane/iso-dodecane at pressures ranging from 0.25 atm to 5 atm.\n    2) Analyze the effects of helium dilution on cool flame behavior.\n    3) Examine the behavior of combustion characteristics.\n    4) Investigate the relationship between droplet size, pressure, and flame extinction, and (5) understand the consequence of soot formation during cool flame combustion.", "approach": "The Combustion Integrated Rack (CIR) contains the Multi-User Droplet Combustion Apparatus (MDCA) which facilitates the controlled combustion of fuel droplets. A system of gas bottles and fuel syringes delivers the desired gas mixture to the combustion chamber ranging from 0.25 to 0.5 atm. Droplets of fuel are dispensed and suspended between hypodermic needles or tethered using silicon-carbide fibers. A hot-wire igniter is positioned near the droplet for ignition. After ignition the wire is retracted. Fuels observed include n-dodecane, farnesane, and mixtures of n-dodecane/iso-dodecane. Fuels diluted with molecular oxygen, atomic nitrogen, and helium to study the influence on flame extinction and dynamics. Flames were observed with a black-and-white camera for droplet size measurements. A UV camera was used for capturing the OH* radical emissions and flame size. Other high resolution cameras were used for monitoring and documentation. Narrow-band and wide-band radiometers for analyzed flame radiation.", "conditions_varied": "Table: pressure (0.5-5 atm as text, e.g. \"1 atm\"), O2, N2, He fractions (O2 values 0.21 and 0.17 only), fiber yes/no, fuel", "outcomes_measured": "No outcome column in table; cool-flame behavior and extinction per objectives text", "known_problems": "Pressure stored as text with inconsistent trailing spaces.", "hardware": "MDCA / CIR", "hardware_basis": "official: FLEX, FLEX-2 and CFI burn liquid droplets in the Multi-user Droplet Combustion Apparatus (MDCA) in the CIR", "tags": [], "table_type": "per_test", "approx_tests": "87 tests", "material_class": "liquid droplet: n-dodecane (C12H26) and mixtures with iso-dodecane", "table_files": ["PSI-39_Experimental table_CFI.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/m6pj-a914; 7 publications listed; 2698 files marked removed in version history (reason not stated). Pressure stored as text with inconsistent trailing spaces."}, {"id": "PSI-47", "title": "Dust and Aerosol Measurement Feasibility Test / Dust and Aerosol Measurement Feasibility Test-2", "acronym": "DAFT / DAFT-2", "platform": "ISS", "license": "CC0-1.0", "doi": "10.60555/ztgj-d202", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-47", "objective": "The focus of DAFT / DAFT-2 was to mitigate the risk for the Smoke Aerosol Measurement Experiment (SAME). SAME relied on a commercially available condensate nuclei counter, the TSI P-Trak,  to quantify smoke aerosols in a microgravity environment, however there were concerns that th P-Trak would not be reliable in microgravity as it relies on gravity to recycle isopropyl alcohol used in the measurement process.\nDAFT / DAFT-2 tests that a modified P-Trak particulate counter would be accurate in microgravity.\n\nSummarized objectives include:\n    1) Demonstrate the Functionality of the Modified TSI P-Trak in Microgravity\n    2) Compare the TSI P-Trak Performance against the DustTrak control\n    3) Create and Analyze Aerosol Standards in Microgravity\n    4) Ensure the reliability of future aerosol experiments", "approach": "The experimental approach consists of the following components:\n\n    1) Modification of Instrumentation: TSI P-Trak was modified for use in microgravity by redesigning the condenser tube to use capillary forces for recycling isopropyl alcohol and removing the mercury switch responsible for detecting instrument orientation.\n    2) Aerosol Generation: Arizona Red Dust (ARD) was chosen as an aerosol standard due to its ease of dispersion. The ARD was aerosolized with GN2 to create particle samples. The aerosol was contained within 15-liter Mylar bags.\n    3) On-Orbit Testing: The modified P-Trak gathered data from counting aerosol particles and these data were compared to the DustTrak CNC specifically designed to work in microgravity.", "conditions_varied": "Instrument feasibility test; session, hardware, sample material, sampled location", "outcomes_measured": "Instrument performance; not a flammability outcome", "known_problems": "Not usable for the flammability table.", "hardware": "ISS (SAME precursor)", "hardware_basis": "catalog platform column: \"ISS\" only (not one of the official hardware groups)", "tags": [{"tag": "detection", "reason": "official Potential Considerations: DAFT and DAFT-2 are dust detection with the SAME instrument"}], "table_type": "summary", "approx_tests": "2 sessions", "material_class": "aerosol (Arizona Road Dust with GN2)", "table_files": ["PSI-47_Experimental table_DAFT.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/ztgj-d202; 2 publications listed; 185 files marked removed in version history (reason not stated). Not usable for the flammability table."}, {"id": "PSI-60", "title": "Computational and Experimental Analysis of SPICE Data Sets", "acronym": "none", "platform": "Ground (analysis of SPICE images)", "license": "CC0-1.0", "doi": "10.60555/mzjm-yv57", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-60", "objective": "This ground investigation  sought to increase understanding of the issues that control the large discrepancy between soot formation in 1g and in 0g flames.  The objective of this investigation was to integrate computational and experimental methods to derive temperature distributions and soot volume fractions from the Smoke Point in Coflow Experiment (SPICE) data available in PSI. By analyzing over 1600 raw DSLR images and incorporating advanced soot models, the study sought to improve understanding of soot formation, oxidation, radiative re-absorption, and aggregate growth in heavily sooting flames. The work further aimed to reconcile microgravity and normal gravity flame behavior, identify key physical and chemical processes influencing smoke point development, and provide a framework for evaluating model parameter sensitivity.", "approach": "The approach  was to combine image processing, experimental diagnostics, and detailed soot modeling. Raw Nikon NEF images were decoded into three color channels and analyzed using color-ratio pyrometry to extract soot temperature fields. Absolute light calibration from SPICE was then used to calculate soot volume fractions. For computational modeling, a coupled flow–species–soot system was implemented, modified to include radiation re-absorption and discrete-sectional aggregate formation. Simulations were performed for both Yale and ACME burner configurations under normal and microgravity conditions. Comparisons between experimental data and computed results guided sensitivity analyses of soot evolution parameters, including the effects of radiation, scattering, boundary conditions, and heat transfer to the burner structure.", "conditions_varied": "n/a (image analysis)", "outcomes_measured": "Soot temperature fields and volume fractions (objectives text)", "known_problems": "Derived from SPICE images; files listed only in PSI.", "hardware": "Ground analysis", "hardware_basis": "catalog platform column: ground analysis or modelling, no flight hardware", "tags": [], "table_type": "none", "approx_tests": "n/a", "material_class": "n/a", "table_files": [], "tests_summary": null, "catalog_notes": "DOI 10.60555/mzjm-yv57; 1 publications listed; 0 files marked removed in version history (reason not stated). Derived from SPICE images; files listed only in PSI."}, {"id": "PSI-62", "title": "Concurrent Flame Spread Modeling using Flamelet Generated Manifolds in Microgravity with Comparison to BASS Experiments using Two-Color Tomography", "acronym": "none", "platform": "Ground (modeling vs BASS)", "license": "CC0-1.0", "doi": "10.60555/e9xp-ex83", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-62", "objective": "The objective of this research was to develop and validate new flamelet generated manifold (FGM) modeling techniques for concurrent flame spread in microgravity. Concurrent flame spread presented one of the greatest modeling challenges in combustion science due to the intricate coupling between heat transfer, mass transport, and chemical kinetics near the solid-vapor interface. Traditional modeling strategies often relied on hybridized turbulence and chemistry models that were not fully consistent and failed to capture important intermediate reaction pathways.\nTo overcome these shortcomings, this PSI grant advanced the use of an unsteady flamelet generated manifold (UFGM) framework that reduced the complexity of reacting systems by mapping them into lower-dimensional manifolds. The research aimed to leverage this methodology to simulate solid fuel combustion processes with high fidelity, using the NASA Burning and Suppression of Solids (BASS and BASS-II) experiments as benchmarks. Ultimately, the long-term goal was to enable accurate prediction of flammability limits for spacecraft materials and to provide a tool that could also serve as a subgrid-scale model in large-eddy simulations of fires, supporting spacecraft safety and hazard mitigation.", "approach": "The approach combined high-resolution computational modeling with experimental validation to study concurrent flame spread in microgravity. A previously developed computational framework  was employed to run fully coupled simulations of fluid–solid responses, focusing on materials subject to charring and ablation. Within this framework, the unsteady FGM method was implemented and tested on various BASS geometries, including flat sheets, spheres, and rod-shaped polymethyl methacrylate (PMMA) samples, as well as wax cylinders.\nExperimental imagery found in PSI from the BASS and BASS-II investigations was post-processed using newly developed two-color tomography methods with DSLR cameras, enabling 3D reconstructions of soot and temperature fields for direct comparison to model predictions. The evaluation metrics included flame geometry, temperature distribution, soot volume fraction, and flame spread rate, with special emphasis on reproducing the “Goldilocks” flammability zone reported by Olson and Ferkul. Comparative analyses were also carried out with a parallel NSF-supported terrestrial flame spread project, ensuring that the predictive capabilities of the UFGM approach were assessed across both microgravity and normal-gravity conditions.", "conditions_varied": "n/a (simulation)", "outcomes_measured": "Model validation vs BASS concurrent flame spread", "known_problems": "None noted.", "hardware": "Ground analysis", "hardware_basis": "catalog platform column: ground analysis or modelling, no flight hardware", "tags": [{"tag": "prevention", "reason": "investigation metadata: models concurrent flame spread and compares it with BASS data"}], "table_type": "none", "approx_tests": "n/a", "material_class": "n/a", "table_files": [], "tests_summary": null, "catalog_notes": "DOI 10.60555/e9xp-ex83; 4 publications listed; 0 files marked removed in version history (reason not stated)."}, {"id": "PSI-68", "title": "Flame Extinguishment Experiment - 2", "acronym": "FLEX-2", "platform": "ISS: CIR/MDCA", "license": "CC0-1.0", "doi": "10.60555/byp8-h018", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-68", "objective": "The primary goal of the FLEX-2 flight experiments is to extend the results of FLEX-1 to fuels and environmental conditions that mimic real combustor conditions, as well as, provide benchmark experimental data on bi-component droplet combustion over a wide range of initial conditions in order to validate numerical simulations and to develop new theoretical models.\n\nDetailed experimental objectives can be further itemized as:\n  1. Investigate the role of liquid-phase mixing on the burning characteristics of bi-component fuel droplets.\n  2. Examine the steady and unsteady liquid and gas-phase phenomena in pure fuel combustion.\n  3. Study flame extinction mechanisms and their boundaries.\n  4. Analyze the soot formation process, including soot volume fraction soot-shell dynamics.\n  5. Determine the influence of droplet interactions on the flammability limits and extinction behavior of droplet arrays.\n  6. Validate theoretical models of droplet combustion through comprehensive experimental data collection in microgravity environments.", "approach": "The chamber was filled with the appropriate atmosphere, which was varied in pressure between 0.5 atm to 3.0 atm and O2 concentration between 0.1 to 0.4 mole fraction with the diluent gas making up the balance. A settling time of approximately 2 minutes  elapsed prior to initiating the test in order to ensure that the temperature and pressure of the chamber gases have stabilized. This settling time was followed by the dispensing of a predetermined amount of fuel (based on the target droplet size) onto the support fiber for those tests in which the droplet is not freely deployed. When sufficient fuel has been dispensed the dispensing needles were retracted and a dwell period of at least 10 seconds was allowed for the droplet internal fluid motion induced by deployment to subside. This was then followed by initiating power to the ignitor for a selectable amount of time ranging from 1 second to 5 seconds after which the ignitor was retracted from the field of view. If the flow field is to be generated by translating the droplet then droplet motion would commence at the same time that the ignitor is retracted. A near real-time download of the color camera video was employed in order to verify successful droplet deployment, ignition, and overall progress of the experiment. Pressure and temperature data of the chamber environment was also recorded in near real time.\n\nThe overall investigation approach can be summarized as:\n  1. Test parameters are determined, including pressure, temperature, fuel mixture, and humidity.\n  2. Fill the combustion chamber with the selected gas mixtures.\n  3. Deploy the droplet(s) carefully controlling the droplet diameter.\n  4. Allow the droplet to stabilize in the microgravity environment.\n  5. Ignite the droplet in a uniform and controlled fashion.\n  6. Monitor combustions and track flame evolution using high speed photography.\n  7. Monitor and adjust experimental conditions as needed.\n  8. Analyze data.\n\nThe independently varied experimental parameters during FLEX-2 experiments were 1) Fuel type 2) Ambient gas composition 3) Ambient Pressure 4) Droplet initial diameter 5) Droplet translation velocity (and acceleration) 6) Droplet spacing and initial size in a binary linear array.", "conditions_varied": "Condition matrix (not per test): initial droplet diameter 1.5-5 mm, diluent O2/N2 or O2/He, O2 mole fraction 0.17-0.30 (four values), pressure 0.5-3.0 atm, flow velocity 0.1-5 cm/s", "outcomes_measured": "Not in table; burning/extinction per objectives text", "known_problems": "Ranges differ slightly from approach text (O2 0.1-0.4).", "hardware": "MDCA / CIR", "hardware_basis": "official: FLEX, FLEX-2 and CFI burn liquid droplets in the Multi-user Droplet Combustion Apparatus (MDCA) in the CIR", "tags": [{"tag": "suppression", "reason": "investigation metadata: FLEX-2 extends FLEX and studies flame extinction mechanisms and their boundaries"}], "table_type": "condition_matrix", "approx_tests": "unknown (8 fuel rows only; per-test count not stated)", "material_class": "liquid droplet: IsoOctane, n-Octane, Heptane, Decane, Ethanol, propanol/glycerol and heptane/IsoOctane mixtures", "table_files": ["PSI-68_Experimental table_Flex2.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/byp8-h018; 48 publications listed; 0 files marked removed in version history (reason not stated). Ranges differ slightly from approach text (O2 0.1-0.4)."}, {"id": "PSI-69", "title": "Flame Extinguishment Experiment", "acronym": "FLEX", "platform": "ISS: CIR/MDCA", "license": "CC0-1.0", "doi": "10.60555/mbq8-0451", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-69", "objective": "The FLEX (Flame Extinguishment Experiment) investigation aims to map the flammability limits of liquid fuels in microgravity environments, measure the effectiveness of various gaseous fire suppressants such as CO2, He, and SF6, and develop reliable predictive models for combustion limits under reduced gravity conditions. The mission seeks to validate and improve simplified models by incorporating detailed chemical reactions, heat transfer, and material movement, using both space-based data and extensive ground-based tests. Key flight experiment goals include obtaining high-resolution measurements of droplet burning rates, flame extinction behavior, heat radiation, soot levels, and temperature profiles, while systematically analyzing the effects of different ambient conditions and suppressant concentrations. These investigations are essential for advancing the fundamental understanding of combustion processes in microgravity and enhancing fire safety protocols for future space missions.", "approach": "The FLEX experiments involve igniting and observing the burning behavior of relatively large droplets. A primary objective of the experiments is to determine the Limiting Oxygen Index (LOI) as a function of ambient pressure and determine how the presence of a suppressant influences the LOI .\nThe basic outline of the procedure to construct this diagram is as follows:\n  1. Select the test pressure (0.5 − 1.5 atm) for the LOI tests.\n  2. Select a smaller droplet size (≈ 3 mm)\n  3. Select an ambient oxygen mole fraction that, based on ground-based testing, will support droplets burning to completion (as opposed to extinguishing at a finite droplet size).\n  4. Perform a droplet combustion test.\n  5. Increase the droplet size or repeat the test (if finite extinction diameter at flame extinction observed).\n  6. Continue steps 4 and 5 until flame exists for only a short time after ignition (radiative extinction).\n  7. Continue steps 4 thru 6 at a decreased ambient oxygen mole fraction.\n  8. Continue step 7 to an ambient oxygen mole fraction where the droplet does not ignite.\n\nThere were ambient conditions where the extinction droplet sizes at all ambient oxygen mole fractions were too small to either be observed or measured with the available diagnostics. In this case, the determination of the LOI is similar, but more iterative. Instead of observing flame extinction, however, the procedure  involved an iterative sequence of tests (burn to completion followed by a no ignition test) with progressively smaller increments in ambient oxygen mole fraction to determine the LOI . For the slow flow tests (in the flight experiment), the configuration of the flight hardware did not allow for adequate diagnostics over the entire test for a droplet in a uniform, steady convective flow.  In these tests, the procedure will be to duplicate tests above which yield finite-sized extinction droplet diameters. Near the end of the tests, prior to flame extinction, the droplet will be subjected to a small, sub-buoyant, convective flow (imparted by translating the droplet at a slow, uniform speed).\n\nThe goal of the experiment is then to see how the presence of this flow influences the extinction process. Note, a large number of the tests involve free droplets (as opposed to fiber-supported droplets) and a number of these tests will have droplets with a slow drift velocity. Data gathered from these tests to examine the influences of a small, sub-buoyant flow on both the burning and extinction process.", "conditions_varied": "Table: ambient pressure (mmHg), mole fractions O, N, CO (header; likely CO2 but not stated), He; initial droplet diameter. Observed ranges: O 0.12-0.34, He 0-0.45, pressure 526-2320 mmHg excluding one 0.0 entry", "outcomes_measured": "Visible flame extinction diameter, burning rate, burn time, test end class (Extinction 186, Disruption 61, Completion 27)", "known_problems": "One pressure entry is 0.0; one duplicated FLEX Identifier; header \"CO ...\" ambiguous (CO vs CO2); some diameters blank (extinction diameter numeric in 197 rows).", "hardware": "MDCA / CIR", "hardware_basis": "official: FLEX, FLEX-2 and CFI burn liquid droplets in the Multi-user Droplet Combustion Apparatus (MDCA) in the CIR", "tags": [{"tag": "suppression", "reason": "official Background: suppression is FLEX (dilution with carbon dioxide and helium)"}], "table_type": "per_test", "approx_tests": "274 tests", "material_class": "liquid droplet: methanol (157 rows), heptane (117 rows)", "table_files": ["PSI-69_Experimental table_FLEX.csv"], "tests_summary": {"tests": 280, "o2": "0.12 to 0.34", "pressure_kpa": "70.17 to 309.3", "flow_cm_s": null, "gravity_g": ["0"], "fuels": ["Methanol", "Heptane"], "n_fuels": 2, "geometry": ["droplet"], "sizes": {}, "outcomes": {"self_extinguished": 191, "burned_to_completion": 28, "other": 61}, "source_refs": ["NTRS 20150023456, PDF p.33 (printed p.27), Table IX, row FLEX-275 | data/transcribed/NTRS20150023456_flex_tests_275_280.csv", "NTRS 20150023456, PDF p.34 (printed p.28), Table IX, row FLEX-276 | data/transcribed/NTRS20150023456_flex_tests_275_280.csv", "NTRS 20150023456, PDF p.34 (printed p.28), Table IX, row FLEX-277 | data/transcribed/NTRS20150023456_flex_tests_275_280.csv", "NTRS 20150023456, PDF p.34 (printed p.28), Table IX, row FLEX-278 | data/transcribed/NTRS20150023456_flex_tests_275_280.csv"]}, "catalog_notes": "DOI 10.60555/mbq8-0451; 51 publications listed; 0 files marked removed in version history (reason not stated). One pressure entry is 0.0; one duplicated FLEX Identifier; header \"CO ...\" ambiguous (CO vs CO2); some diameters blank (extinction diameter numeric in 197 rows)."}, {"id": "PSI-98", "title": "Spacecraft Fire Safety Experiment-I", "acronym": "SAFFIRE-I", "platform": "Cygnus (Saffire-1 enclosure) after ISS departure", "license": "CC0-1.0", "doi": "10.60555/0t15-1z43", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-98", "objective": "The objectives of this investigation were to:\n(1) determine how rapidly a large scale fire grows in low-gravity and (2) investigate the low-g flammability limits compared to those obtained in NASA’s normal\ngravity material flammability screening test.", "approach": "The Saffire-1 experiments was performed on the Orbital Science’s Cygnus resupply vehicle after it deberthed from the ISS. The sample material for Saffire-I is a composite fabric called Sibal consisting of cotton on a fiberglass substrate (75% cotton, 25% fiberglass by weight). It has been used in many space experiments because it burns like cotton but maintains structural integrity after the cotton is consumed. The sample was approximately 0.94 meters long and 0.4 meters wide, simulating a large piece of flammable fabric. The Saffire-1 flight unit had a sample card installed in the middle of a large flow duct. Air is drawn through the flow duct by fans located at the top of the duct with flow straighteners at the bottom of the experiment module. Saffire-I was conducted at an air flow velocity of 20 cm/s. Once the sample was ignited flame images were captured using two cameras. In addition, thermocouples provided flow, flame, and plume temperatures, two radiometers recorded flame radiation, solid state sensors were used to measure pressure, CO2 and O2 mole faction, and two anemometer tracked flow velocity. All data was compressed, and subsequently downlinked.", "conditions_varied": "Per sample: thickness, length, width, air flow 20 cm/s, % O2 (~21.5), ignition power and time, flow direction (concurrent/opposed)", "outcomes_measured": "Burn time (s); camera file IDs", "known_problems": "Very few tests.", "hardware": "Saffire (Cygnus)", "hardware_basis": "catalog platform column (Saffire flew on Cygnus; not one of the official hardware groups)", "tags": [{"tag": "prevention", "reason": "official Background: solid materials were studied in BASS, BASS-II, Saffire-I, -II, -III"}], "table_type": "per_sample", "approx_tests": "2 samples", "material_class": "solid fabric: SIBAL (cotton/fiberglass)", "table_files": ["PSI-98_Experimental table_SAFFIRE-1.csv"], "tests_summary": {"tests": 2, "o2": "0.215", "pressure_kpa": null, "flow_cm_s": "20", "gravity_g": ["0"], "fuels": ["SIBAL Fabric"], "n_fuels": 1, "geometry": [], "sizes": {"thickness mm": "3.7", "width cm": "40.6", "length cm": "94"}, "outcomes": {"unknown": 2}, "source_refs": ["data/raw/psi/PSI-98/PSI-98_Experimental table_SAFFIRE-1.csv"]}, "catalog_notes": "DOI 10.60555/0t15-1z43; 6 publications listed; 85 files marked removed in version history (reason not stated). Very few tests."}, {"id": "PSI-99", "title": "Spacecraft Fire Experiment-II", "acronym": "SAFFIRE-II", "platform": "Cygnus spacecraft", "license": "CC0-1.0", "doi": "10.60555/2chp-m469", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-99", "objective": "The objectives of SAFFIRE-II are to determine how rapidly a large scale fire grows in low-gravity and to investigate the low-g flammability limits compared to those obtained in NASA’s normal gravity material flammability screening test.", "approach": "The Saffire-II experiment was performed on the Orbital Science’s Cygnus resupply vehicle after it deberthed from the ISS. As a follow on to the Saffire-I investigation, the Saffire-II investigation added more samples including SIBAL, silicone, structure PMMA, flat PMMA, and PMMA with Nomex. The Saffire-1I flight unit had a sample card installed in the middle of a large flow duct. Air is drawn through the flow duct by fans located at the top of the duct with flow straighteners at the bottom of the experiment module. Saffire-II has a sample card that contains 9 samples, each 5 cm x 29 cm. Depending on the sample material, the Saffire-II was conducted at an air flow velocity of either 20 or 30 cm/s, the flow being either concurrent or opposed.  Once the sample was ignited flame images were captured using two cameras. In addition, thermocouples provided flow, flame, and plume temperatures, two radiometers recorded flame radiation, solid state sensors were used to measure pressure, CO2 and O2 mole faction, and two anemometer tracked flow velocity. All data was compressed, and subsequently downlinked. Details related to samples and experimental parameters are provided in the Experimental Details file in the Science document folder.", "conditions_varied": "Per sample: thickness, length, width, air flow 20 cm/s, % O2 (derived from CO2 production), ignition power/time, flow direction", "outcomes_measured": "Burn time, microgravity burn and spread length, 1-g burn length and 1-g spread rate comparison columns", "known_problems": "Header characters garbled (\"?-g\"); two sample rows have blank material; includes Earth-gravity comparison columns.", "hardware": "Saffire (Cygnus)", "hardware_basis": "catalog platform column (Saffire flew on Cygnus; not one of the official hardware groups)", "tags": [{"tag": "prevention", "reason": "official Background: solid materials were studied in BASS, BASS-II, Saffire-I, -II, -III"}], "table_type": "per_sample", "approx_tests": "9 samples", "material_class": "solid: silicone, SIBAL, PMMA, PMMA+Nomex", "table_files": ["PSI-99_Experimental table_SAFFIRE-2.csv"], "tests_summary": {"tests": 19, "o2": "0.215 to 0.221", "pressure_kpa": null, "flow_cm_s": "20", "gravity_g": ["0", "1"], "fuels": ["Silicone", "PMMA", "Cotton-Fiberglass (SIBAL)", "Cotton-Fiberglass", "Nomex"], "n_fuels": 5, "geometry": [], "sizes": {"thickness mm": "0.27 to 10", "width cm": "5", "length cm": "5 to 29"}, "outcomes": {"unknown": 9, "burned_to_completion": 9, "no_ignition": 1}, "source_refs": ["data/raw/psi/PSI-99/PSI-99_Experimental table_SAFFIRE-2.csv"]}, "catalog_notes": "DOI 10.60555/2chp-m469; 7 publications listed; 0 files marked removed in version history (reason not stated). Header characters garbled (\"?-g\"); two sample rows have blank material; includes Earth-gravity comparison columns."}, {"id": "PSI-100", "title": "Spacecraft Fire Experiment-III", "acronym": "SAFFIRE-III", "platform": "Cygnus (Saffire III enclosure) after ISS departure", "license": "CC0-1.0", "doi": "10.60555/040q-4h36", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-100", "objective": "The objectives of this investigation were to:\n(1) determine how rapidly a large scale fire grows in low-gravity and (2) investigate the low-g flammability limits compared to those obtained in NASA’s normal gravity material flammability screening test.", "approach": "The Saffire-III experiments were performed on the Orbital Science’s Cygnus resupply vehicle after it deberthed from the ISS. As a follow on to the Saffire 1 investigation, the Saffire III investigation also used SIBAL as the sample material. However, the experiments were conducted at a flow velocity of 30 cm/s compared to 20 cm/s during Saffire I. The flow was either concurrent or opposed.  Once the sample was ignited flame images were captured using two cameras. In addition, thermocouples provided flow, flame, and plume temperatures, two radiometers recorded flame radiation, solid state sensors were used to measure pressure, CO2 and O2 mole faction, and two anemometer tracked flow velocity. All data was compressed, and subsequently downlinked. Details related to samples and experimental parameters are provided in the Experimental Details file in the Science document folder.", "conditions_varied": "Per sample: dimensions, air flow 30 cm/s, direction (concurrent/opposed)", "outcomes_measured": "None in table", "known_problems": "No O2 or outcome columns.", "hardware": "Saffire (Cygnus)", "hardware_basis": "catalog platform column (Saffire flew on Cygnus; not one of the official hardware groups)", "tags": [{"tag": "prevention", "reason": "official Background: solid materials were studied in BASS, BASS-II, Saffire-I, -II, -III"}], "table_type": "per_sample_minimal", "approx_tests": "2 samples", "material_class": "solid fabric: SIBAL", "table_files": ["PSI-100_Experimental table_SAFFIRE-3.csv"], "tests_summary": {"tests": 2, "o2": null, "pressure_kpa": null, "flow_cm_s": "30", "gravity_g": ["0"], "fuels": ["SIBAL Fabric"], "n_fuels": 1, "geometry": [], "sizes": {"thickness mm": "3.3", "width cm": "40.6", "length cm": "94"}, "outcomes": {"unknown": 2}, "source_refs": ["data/raw/psi/PSI-100/PSI-100_Experimental table_SAFFIRE-3.csv"]}, "catalog_notes": "DOI 10.60555/040q-4h36; 3 publications listed; 97 files marked removed in version history (reason not stated). No O2 or outcome columns."}, {"id": "PSI-101", "title": "Smoke Aerosol Measurement Experiment-Reflight", "acronym": "SAME-R", "platform": "ISS: Glovebox (SAME hardware)", "license": "CC0-1.0", "doi": "10.60555/2np7-jv14", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-101", "objective": "Similar to the original SAME investigation, the primary objective of the SAME-R investigation was to quantify the sizes that the liquid smoke particulate achieves in low gravity and to relate the droplet size distribution to the smoke generation and smoke transport conditions in the experiment. One of the problems encountered during the SAME investigation was that after the thermal precipitators were returned to the ground, it was found that all the TEM grids were severely contaminated with some unidentified foreign particles, making these grids unusable although some of them showed shapes of certain types of smoke particles. Based on that experience the SAME-R investigation employed several modification covering new materials, extended operating conditions, and diagnostic equipments.", "approach": "SAME-R utilized the SAME hardware used on-orbit. Based on the experience gained from SAME, SAME-R included the following modifications: 1) a new test material,\nPyrell®, an intumescent fire-retardant foam by Foamex, was introduced to replace DBP samples, 2) test conditions were broadened including higher heating temperatures and no-flow during sample heating time, and 3) a new instrument, M-pass, developed in-house GRC, was used to replace one of the two Commercial Diagnostic Enclosures that includes a DustTrak and an ionization detector used in SAME. SAME-R flight tests were conducted from July 16, to September 9, 2010, successfully completing 66 test points. After SAME-R flight tests, three major post–flight ground tests were performed to improve data reduction process and to validate the lognormal distribution assumption, the key to the moment method employed by SAME and SAME-R.", "conditions_varied": "Per test: sample type, inlet velocity (cm/s), heating/aging/mixing durations", "outcomes_measured": "Rt/R0 (smoke particle size ratio); smoke detection implications per objectives", "known_problems": "Smoke/detection data, not flammability.", "hardware": "MSG (SAME)", "hardware_basis": "catalog platform column: Microgravity Science Glovebox, SAME hardware (not one of the official hardware groups)", "tags": [{"tag": "detection", "reason": "official Background: detection is SAME and SAME-R"}], "table_type": "per_test", "approx_tests": "109 tests", "material_class": "smoke from heated Kapton, silicone, lampwick, Pyrell, Teflon", "table_files": ["PSI-101_Experimental table_SAME-R.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/2np7-jv14; 6 publications listed; 379 files marked removed in version history (reason not stated). Smoke/detection data, not flammability."}, {"id": "PSI-102", "title": "Smoke and Aerosol Measurement Experiment", "acronym": "SAME", "platform": "ISS: Microgravity Science Glovebox", "license": "CC0-1.0", "doi": "10.60555/gd4k-8h62", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-102", "objective": "One of the major goals of this investigation was to quantify the sizes that the liquid smoke particulate achieves in low gravity and to relate the droplet size distribution to the smoke generation and smoke transport conditions in the experiment. A numerical code was to be developed to predict the smoke droplet growth as a function of the fuel pyrolysis rate, the thermodynamic properties of the pyrolysis vapor, and the flow environment.", "approach": "The crew installed the near field hardware in the Glovebox, attached the Far Field Box to the Glovebox, and positioned the video cameras. The operator then ran the self diagnostic procedures on the two smoke detectors and activated the video cameras, turned on the igniter for a predefined period of time (15 to 60 seconds), and initiated the thermophoretic soot samplers to sample the smoke. The actual duration of each combustion event was typically 2 minutes. After flight, the particulate collected on the thermophoretic probes were analyzed using a Transmission Electron microscope (TEM) to determine primary and aggregate particle dimensions. The remains of the samples were weighed to determine their mass loss. The digital data was transcribed from the video record and analyzed to determine the response of the detectors. Once the flight mass loss rates were determined, 1-g operation conditions to produce the same loss were determined.The measurements were made using smoke generated by overheated  spacecraft materials where variables such as the sample temperature, flow field, and particle aging time were more rigorously controlled.", "conditions_varied": "Per sample: material, air flow (cm/s), weight loss rate (mg/min), aging duration", "outcomes_measured": "Smoke particle size per objectives text (not in table)", "known_problems": "None noted.", "hardware": "MSG (SAME)", "hardware_basis": "catalog platform column: Microgravity Science Glovebox, SAME hardware (not one of the official hardware groups)", "tags": [{"tag": "detection", "reason": "official Background: detection is SAME and SAME-R"}], "table_type": "per_sample", "approx_tests": "8 samples", "material_class": "smoke from heated Teflon and other samples (8 rows)", "table_files": ["PSI-102_Experimental table_SAME.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/gd4k-8h62; 16 publications listed; 52 files marked removed in version history (reason not stated)."}, {"id": "PSI-106", "title": "Structure and Liftoff In Combustion Experiment", "acronym": "SLICE", "platform": "ISS", "license": "CC0-1.0", "doi": "10.60555/pm12-rg61", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-106", "objective": "Objective: The objective of this investigation is to better understand the structure and stability of laminar diffusion flames in microgravity.\n\nSpecific objectives of this investigation were:\n1. To investigate the structure of laminar diffusion flames in microgravity to understand the stabilizing mechanisms at the flames base.\n2. Determine the liftoff velocity limits for different fuels and burner diameters.\n3. Evaluate the impact of fuel dilution with nitrogen on soot formation and flame stability.\n4. Quantify the effects of microgravity on flame length and radiative heat loss compared to normal gravity conditions.\n5. Validate numerical models for flame dynamics, soot production, and thermal radiation in non-premixed flames.", "approach": "The SLICE apparatus consisted of a fan-driven flow duct, exchangeable burner tubes, and integrated sensors to measure flow rates and temperature. This setup used several fuels such as methane, ethylene, and nitrogen-diluted mixtures. Flames were then manually ignited and observed under controlled coflow air conditions. A high resolution camera captured still images while sensor data was overlaid on these images. Calibration tests for airflow velocity, soot measurement, and the fans were conducted to ensure the accuracy of the results. More than 4,000 high-resolution images were captured across 13 testing experiments. Data was then analyzed to correlate flame structure with stability with flow dynamics and fuel properties.", "conditions_varied": "Table has only test date and fuel type", "outcomes_measured": "None in table", "known_problems": "Rows mix dates and free-text descriptions.", "hardware": "MSG flow duct", "hardware_basis": "official: BASS, BASS-II, SPICE and SLICE use the Microgravity Science Glovebox (MSG); fan-driven flow duct built for SPICE", "tags": [], "table_type": "minimal", "approx_tests": "12 rows", "material_class": "gas fuel (CH4, 40% CH4 with N2)", "table_files": ["PSI-106_Experimental table_Slice.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/pm12-rg61; 5 publications listed; 0 files marked removed in version history (reason not stated). Rows mix dates and free-text descriptions."}, {"id": "PSI-107", "title": "Smoke Point In Co-flow Experiment", "acronym": "SPICE", "platform": "ISS: Microgravity Science Glovebox", "license": "CC0-1.0", "doi": "10.60555/9kbh-e962", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-107", "objective": "The objective of SPICE is to better understand the complex process of combustion by observing flames in a microgravity environment aboard the International Space Station (ISS) and analogous ground experiments.\n\nSpecific objectives were:\n(1) Identify the laminar smoke-point properties of non-buoyant jet diffusion flames under various co-flow conditions in microgravity.\n(2) Determine the effects of burner diameter and co-flow velocity on the luminous flame lengths and smoke points.\n(3) Quantify the sooting propensity of different fuels, such as ethylene, propane, and propylene mixtures.\n(4) Validate the correlation between luminous flame shape and residence time under microgravity conditions.\n(5) Investigate the impact of air and fuel flow rate variations on smoke point phenomena in space.", "approach": "The experimental setup in the microgravity science glovebox consisted of an apparatus with a flow duct with integrated nozzles, cameras, and fuel delivery systems. Fuels tested included methane, ethylene, propane, propylene, and propylene mixtures. Each flame was ignited in a controlled co-flow air environment, with burner diameters of 0.41 mm, 0.76 mm, and 1.6 mm and co-flow velocities ranging from 5.4 cm/s to 65 cm/s. Fuel flow rates were adjusted to identify the smoke point, marked by the flame's transition to emitting soot. Data such as flame lengths were recorded using still and video cameras. Measurements included flame height, radiative heat losses, and co-flow air velocity distributions. In total 526 flames were studied.", "conditions_varied": "Per flame: nozzle diameter (mm), fuel rate (sccm, mg/s), air coflow velocity (cm/s)", "outcomes_measured": "Ignition and flame-off times (duration derivable); smoke point per objectives text", "known_problems": "Some rows duplicated; fuel labels inconsistent (\"75 % Propylene\" vs \"75% Propylene\"); \"GMT date\" is a day number.", "hardware": "MSG flow duct", "hardware_basis": "official: BASS, BASS-II, SPICE and SLICE use the Microgravity Science Glovebox (MSG); fan-driven flow duct built for SPICE", "tags": [], "table_type": "per_test", "approx_tests": "469 rows (435 distinct)", "material_class": "gas fuel: propylene mixtures 352, propane 50, ethylene 47, methane 4 (rows)", "table_files": ["PSI-107_Experimental table_Spice.csv"], "tests_summary": null, "catalog_notes": "DOI 10.60555/9kbh-e962; 9 publications listed; 216 files marked removed in version history (reason not stated). Some rows duplicated; fuel labels inconsistent (\"75 % Propylene\" vs \"75% Propylene\"); \"GMT date\" is a day number."}, {"id": "PSI-115", "title": "Utilization of the Smoke Aerosol Measurement Experiment Data for Advanced Modeling and Simulation of Smoke Generation in Micro-Gravity", "acronym": "none", "platform": "Ground (simulation of SAME)", "license": "CC0-1.0", "doi": "10.60555/q0v5-1v28", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-115", "objective": "The objective of this investigation was to use numerical simulation to explore the influence of gravity on pyrolysis smoke growth from a fundamental perspective. The intention of this effort is to quantify the differences between microgravity and Earth gravity smoke, and to identify the fluid dynamic mechanisms that cause the differences.", "approach": "The formation and growth of dibutyl-phthalate (DBP) particles in Earth gravity and microgravity environments was simulated. Direct numerical simulation via a Navier-Stokes nodal approach was utlilized. The smoke originates from pyrolysis vapor expelled from a heated sample in a geometry similar to that considered in the SAME experiments. This study considered two cross-flow velocities of sufficiently low speed that buoyancy cannot be neglected in the presence of gravity. Simulations are presented to assess the dependence of particle size distributions on thermophoresis, particle settling, and flow geometry. The final report for this investigation introduces the simulation and modeling methodology, followed by a description of the flow geometry and the parameter space under consideration.The differences in the wake geometry attributable to buoyancy for the lower of two flow speeds was examined.  Instantaneous scalar fields were used to describe particle accumulation and growth in the buoyant and non-buoyant wakes that form downstream of the hot vapor source.", "conditions_varied": "n/a (simulation)", "outcomes_measured": "Simulated smoke growth in micro vs Earth gravity", "known_problems": "No publications listed in PSI.", "hardware": "Ground analysis", "hardware_basis": "catalog platform column: ground analysis or modelling, no flight hardware", "tags": [{"tag": "detection", "reason": "investigation metadata: simulates pyrolysis smoke growth in a geometry similar to the SAME experiments"}], "table_type": "none", "approx_tests": "n/a", "material_class": "n/a", "table_files": [], "tests_summary": null, "catalog_notes": "DOI 10.60555/q0v5-1v28; 0 publications listed; 38 files marked removed in version history (reason not stated). No publications listed in PSI."}, {"id": "PSI-117", "title": "Effect of External Thermo-Convective Perturbation on Cool Flame Dynamics: A Multidimensional Multi-Physics CFD Analysis", "acronym": "none", "platform": "Ground (CFD of FLEX cool flames)", "license": "CC0-1.0", "doi": "10.60555/gz0q-b577", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-117", "objective": "The objective of this ground investigation was to use flight data obtained from PSI through NASA’s Flame Extinguishment Experiment (FLEX) to quantify how externally imposed thermal and convective perturbations regulated the dynamics and ultimate fate of already established droplet cool flames, and to explain run-to-run variability by isolating the roles of deliberate heating and unintentional drift-induced convection. Focusing on both small and large droplets, the work mapped stability windows for ignition, sustained oscillation, transitions to hot ignition and warm-flame behavior, and extinction under microgravity. By leveraging and extending the FLEX data in the PSI, this study produced reusable models and sensitivity analyses that coupled low-temperature chemistry with transport and radiative effects.", "approach": "OpenFOAM was used to develop a 3-D CFD model of n-alkane droplet cool flames in microgravity, coupling variable-density Navier–Stokes flow with low-temperature combustion chemistry, coupled heat and mass transfer, and radiation. Model fidelity was established against ISS FLEX measurements, after which controlled simulations examined three forcing modes (i) convection alone to mimic droplet drift, (ii) imposed heat flux, and (iii) combined convection plus heating applied to both large (1–4 mm) and sub-millimeter (~0.5 mm) droplets.\n\nTo accelerate progress, the study began with simplified chemistry and transitioned to reduced mechanisms for parameter sweeps over forcing amplitude and frequency, ambient composition (including ozone-assisted cases), and pressure. From each case, predictive observables were extracted (ignition delay, oscillation frequency and amplitude, stand-off and extinction diameters), and were used to construct stability maps that delineated conditions for cool-flame onset, persistence, and quenching. These maps were reconciled with FLEX observations and were used to guide next-generation test matrices for both large- and small-droplet experiments.", "conditions_varied": "n/a (simulation)", "outcomes_measured": "Cool-flame dynamics and extinction (simulated)", "known_problems": "Release date 10-Jun-2026 per PSI record.", "hardware": "Ground analysis", "hardware_basis": "catalog platform column: ground analysis or modelling, no flight hardware", "tags": [], "table_type": "none", "approx_tests": "n/a", "material_class": "n/a", "table_files": [], "tests_summary": null, "catalog_notes": "DOI 10.60555/gz0q-b577; 10 publications listed; 0 files marked removed in version history (reason not stated). Release date 10-Jun-2026 per PSI record."}, {"id": "PSI-142", "title": "Quantitative Studies of Cool Flame Transitions at Radiation / Stretch Extinction Using Counterflow Flames", "acronym": "none", "platform": "Ground (counterflow experiments using FLEX conditions)", "license": "CC0-1.0", "doi": "10.60555/80qf-vj95", "psi_url": "https://psi.nasa.gov/physci/repo/data/investigations/PSI-142", "objective": "By using the Flame Extinguishment (FLEX) experimental data from the Physical Sciences Informatics (PSI) system of combustion science, the purpose of this grant was to conduct new simulations and ground-based experiments using ozone-sensitized counterflow flames to:\n    1) Develop a new diagram of the flammability limits of diffusional cool flames affected by radiation, diffusion, and convection.\n    2) Bridge the knowledge gap between the flammability limits and extinction limits of hot flames and cool flames.\n    3) Verify the phenomena observed on the ISS flame extinguishment experiments.\n    4) Obtain new, quantitative data of extinction limit, flame temperature, and species distribution for the validation of kinetic and radiation models involving cool flames.\n    5) Extend the cool flame experiments from the original ISS droplet experiments to a more general ground-based combustion system involving radiation, diffusion, convection, and low-temperature chemistry while maintaining a one-dimensional geometry.", "approach": "Using the experimental conditions of FLEX flight, a comparative studies of the oxygen concentration effects on the extinction limits of cool flames was conducted using three different numerical modeling schemes, (a) spark-assisted flame propagation of a n-heptane/air mixture, (b) one dimensional freely-propagating dimethyl ether (DME) flames using an arc-length continuation method and (c) simulated cool flame regimes and burning limits at elevated pressure (up to 20 atm) using DME/air mixtures.\n\nSpecific research details are outlined in the publication, ''Dynamics of cool flames'' [https://doi.org/10.1016/j.pecs.2019.100787]; '' Understanding Cool Flames and Warm Flames'', [https://doi.org/10.1016/j.proci.2020.09.019] and ''Study of the low-temperature reactivity of large n-alkanes through cool diffusion flame extinction'', [https://doi.org/10.1016/j.combustflame.2017.01.028].", "conditions_varied": "Index table: data ID, description, publicat ations/20260002050"}, {"item_id": "20130013505", "title": "Effects of the 8 psia / 32% O2 Atmosphere on the Human in the Spaceflight Environment", "license": "NTRS rights determination: PUBLIC_USE_PERMITTED (not an open license)", "url": "https://ntrs.nasa.gov/citations/20130013505"}, {"item_id": "20150021491", "title": "Evidence Report: Risk of Hypobaric Hypoxia from the Exploration Atmosphere", "license": "NTRS rights determination: PUBLIC_USE_PERMITTED (not an open license)", "url": "https://ntrs.nasa.gov/citations/20150021491"}, {"item_id": "NASA/TP-2010-216134", "title": "Recommendations for Exploration Spacecraft Internal Atmospheres: The Final Report of the NASA Exploration Atmospheres Working Group", "license": "unknown (no license text read)", "url": "https://www.nasa.gov/wp-content/uploads/2023/03/henninger-8.2-34-atm-tp216134-2010.pdf"}], "bre_quote": "NASA - considered atmosphere for human space missions will be examined: 14.7 psia, 21 % oxygen: 10.2 psia, 26.5 %; and 8.2 psia, 34 % oxygen", "build": {"tests_rows": 885, "investigations": 24}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ND = D.nd;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || u)}</a>`;
const nd = () => `<span class="nd">${esc(ND)}</span>`;
const TABS = [['inv','Investigations'],['cmp','Compare'],['mis','Mission atmospheres'],['grav','Partial-gravity bounds'],['earth','Earth applications'],['about','About']];
const sel = new Set(); let filterTag = '', filterHw = '', q = '';

function show(id){ TABS.forEach(([k]) => { $('#s-'+k).classList.toggle('on', k===id); }); document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.k===id)); if(id==='cmp') renderCmp(); window.scrollTo(0,0); }
$('#tabs').innerHTML = TABS.map(([k,t]) => `<button data-k="${k}" onclick="show('${k}')">${t}</button>`).join('');

/* ---------- G1/G2: investigations list with tag and hardware filters ---------- */
const hwList = [...new Set(D.investigations.map(i => i.hardware))].sort();
function tagsHtml(i){ return i.tags.length ? i.tags.map(t => `<span class="tag ${t.tag}" title="${esc(t.reason)}">${t.tag}</span>`).join(' ') : `<span class="tag none" title="No basis in the official Background text or the investigation metadata">untagged</span>`; }
function renderInv(){
  const list = D.investigations.filter(i => (!filterTag || (filterTag==='untagged' ? !i.tags.length : i.tags.some(t => t.tag===filterTag))) && (!filterHw || i.hardware===filterHw) &&
    (!q || (i.id+' '+i.title+' '+i.acronym+' '+i.objective).toLowerCase().includes(q)));
  $('#s-inv').innerHTML = `<h2>${D.investigations.length} combustion investigations</h2>
  <p class="muted small">Tags: prevention, detection, suppression follow the official Background text where it names the investigation, otherwise the investigation's own metadata; hover a tag for its reason. Tick two or three cards and open <b>Compare</b>.</p>
  <div class="row"><input type="search" id="q" placeholder="Search title, acronym, objective" value="${esc(q)}" aria-label="Search">
  <select id="ft" aria-label="Filter by tag"><option value="">All tags</option>${['prevention','detection','suppression','untagged'].map(t=>`<option ${filterTag===t?'selected':''}>${t}</option>`).join('')}</select>
  <select id="fh" aria-label="Filter by hardware group"><option value="">All hardware groups</option>${hwList.map(h=>`<option ${filterHw===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
  <button class="btn" onclick="show('cmp')">Compare selected (${sel.size})</button></div>
  <p class="small muted">${list.length} shown</p>
  <div class="grid">${list.map(card).join('')}</div>`;
  $('#q').oninput = e => { q = e.target.value.toLowerCase(); const p = e.target.selectionStart; renderInv(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
  $('#ft').onchange = e => { filterTag = e.target.value; renderInv(); };
  $('#fh').onchange = e => { filterHw = e.target.value; renderInv(); };
}
function card(i){
  const t = i.tests_summary;
  return `<div class="card"><label class="row"><input type="checkbox" ${sel.has(i.id)?'checked':''} onchange="toggle('${i.id}',this)"> <b>${esc(i.id)}</b> ${esc(i.acronym && i.acronym!=='none' ? i.acronym : '')}</label>
  <div>${esc(i.title)}</div><div class="row small" style="margin:6px 0">${tagsHtml(i)} <span class="tag">${esc(i.hardware)}</span></div>
  <div class="small muted">${t ? `${t.tests} test rows in the unified table` : 'no rows in the unified table'}${i.approx_tests && i.approx_tests!==ND ? ' | catalog: '+esc(i.approx_tests) : ''}</div>
  <details><summary class="small">Details</summary>${detail(i)}</details></div>`;
}
function detail(i){
  const t = i.tests_summary, f = (label, val, src) => `<p><b>${label}</b><br>${val || nd()}<br><span class="src">Source: ${src}</span></p>`;
  const psi = link(i.psi_url, 'PSI record ' + i.id);
  return f('Objectives', i.objective && i.objective!==ND ? `<pre class="t">${esc(i.objective)}</pre>` : '', psi) +
   f('Approach (fuels, hardware, sensors as described in the record)', i.approach && i.approach!==ND ? `<pre class="t">${esc(i.approach)}</pre>` : '', psi) +
   f('Conditions varied', i.conditions_varied && i.conditions_varied!==ND ? `<pre class="t">${esc(i.conditions_varied)}</pre>` : '', psi + ' and the downloaded table (' + esc(i.table_files.join('; ') || 'none') + ')') +
   f('Measurements', i.outcomes_measured && i.outcomes_measured!==ND ? `<pre class="t">${esc(i.outcomes_measured)}</pre>` : '', psi) +
   f('Fuels in the unified table', t ? esc(t.fuels.join('; ') + (t.n_fuels>t.fuels.length ? ` (+${t.n_fuels-t.fuels.length} more)` : '')) + (t.geometry.length ? '<br>shape: '+esc(t.geometry.join(', ')) : '') + (Object.keys(t.sizes).length ? '<br>size: '+esc(Object.entries(t.sizes).map(([k,v])=>k+' '+v).join('; ')) : '') : '', 'data/processed/tests.csv rows for ' + i.id) +
   f('Hardware group', esc(i.hardware), i.hardware_basis ? esc(i.hardware_basis) + ' | ' + link(D.official,'official challenge page') : '') +
   `<p class="src">PSI record license: ${esc(i.license || 'not stated')} ${i.doi ? '| DOI '+esc(i.doi) : ''}</p>` + (i.known_problems ? `<p class="small"><b>Known problems with the data:</b> ${esc(i.known_problems)}</p>` : '');
}
function toggle(id, el){ if(el.checked){ if(sel.size>=3){ el.checked=false; alert('Compare up to three investigations.'); return; } sel.add(id);} else sel.delete(id); renderInv(); }

/* ---------- G1: comparison view ---------- */
const FIELDS = [
  ['Hardware group', i => i.hardware, i => esc(i.hardware), 'official challenge page / catalog platform', 1],
  ['Platform (PSI record)', i => i.platform, i => esc(i.platform), 'PSI record', 1],
  ['Safety area', i => i.tags.map(t=>t.tag).sort().join(', ') || 'untagged', i => tagsHtml(i), 'official Background text / investigation metadata', 1],
  ['Gravity levels in the table', i => i.tests_summary ? i.tests_summary.gravity_g.join(', ') : '', i => i.tests_summary ? esc(i.tests_summary.gravity_g.join(', ')) + ' g' : '', 'unified test table', 1],
  ['Oxygen (mole fraction)', i => i.tests_summary?.o2 || '', i => i.tests_summary?.o2 ? esc(i.tests_summary.o2) : '', 'unified test table', 1],
  ['Pressure (kPa)', i => i.tests_summary?.pressure_kpa || '', i => i.tests_summary?.pressure_kpa ? esc(i.tests_summary.pressure_kpa) : '', 'unified test table', 1],
  ['Flow (cm/s)', i => i.tests_summary?.flow_cm_s || '', i => i.tests_summary?.flow_cm_s ? esc(i.tests_summary.flow_cm_s) : '', 'unified test table', 1],
  ['Fuels in the table', i => i.tests_summary ? i.tests_summary.fuels.slice(0,3).join('; ') : '', i => i.tests_summary ? esc(i.tests_summary.fuels.join('; ')) : '', 'unified test table', 1],
  ['Sample or burner shape and size', i => i.tests_summary ? i.tests_summary.geometry.join(', ') : '', i => i.tests_summary ? esc(i.tests_summary.geometry.join(', ')) + (Object.keys(i.tests_summary.sizes).length ? '<br>' + esc(Object.entries(i.tests_summary.sizes).map(([k,v])=>k+' '+v).join('; ')) : '') : '', 'unified test table', 1],
  ['Test table in the catalog', i => i.table_type, i => esc(i.table_type), 'data/catalog.csv', 1],
  ['Objectives', i => i.objective, i => `<pre class="t">${esc(i.objective)}</pre>`, 'PSI record', 0],
  ['Approach (fuels, hardware, sensors)', i => i.approach, i => `<pre class="t">${esc(i.approach)}</pre>`, 'PSI record', 0],
  ['What varied between tests', i => i.conditions_varied, i => `<pre class="t">${esc(i.conditions_varied)}</pre>`, 'PSI record and downloaded table', 0],
  ['Measurements', i => i.outcomes_measured, i => `<pre class="t">${esc(i.outcomes_measured)}</pre>`, 'PSI record', 0]];
function renderCmp(){
  const ids = [...sel], inv = ids.map(id => D.investigations.find(i => i.id===id));
  if(inv.length<2){ $('#s-cmp').innerHTML = `<h2>Compare investigations</h2><p>Select two or three investigations on the <a href="#" onclick="show('inv');return false">Investigations</a> tab (tick the box on each card).</p>`; return; }
  const rows = FIELDS.map(([label, key, view, src, short]) => {
    const keys = inv.map(i => (key(i) || '').trim()), known = keys.filter(k => k && k!==ND);
    const same = known.length===inv.length && new Set(keys).size===1;
    const cls = (k) => !k || k===ND ? 'nd' : (short ? (same ? 'same' : 'diff') : '');
    return `<tr><th scope="row">${label}<div class="src">${esc(src)}</div></th>${inv.map((i,n) => `<td class="${cls(keys[n])}">${keys[n] && keys[n]!==ND ? view(i) : nd()}</td>`).join('')}</tr>`;
  }).join('');
  const shared = inv.map(i => new Set(i.tags.map(t => t.tag))).reduce((a,b) => new Set([...a].filter(x => b.has(x))));
  $('#s-cmp').innerHTML = `<h2>Compare: ${inv.map(i=>esc(i.id)+' '+esc(i.acronym && i.acronym!=='none' ? i.acronym : '')).join(' | ')}</h2>
  <p class="small"><span class="tag" style="background:var(--same)">same</span> <span class="tag" style="background:var(--diff)">differs</span> <span class="tag" style="background:var(--nd)">not documented</span> Highlighting applies to the short fields; the long text fields are shown in full for you to read. ${shared.size ? 'Safety areas in common: <b>'+[...shared].join(', ')+'</b>.' : 'No safety area in common (or not tagged).'}</p>
  <div class="scroll"><table><thead><tr><th></th>${inv.map(i=>`<th>${esc(i.id)}<br><span class="small">${esc(i.title)}</span><br>${link(i.psi_url,'PSI record')}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- G3: mission atmospheres ---------- */
function renderMis(){
  const P = D.profiles;
  const fam = p => Object.entries(p.tests_inside_by_family).map(([f,d]) => `${esc(f)}: ${d.tests} tests (gravity ${esc(d.gravity_levels.join(', '))} g; outcomes ${esc(Object.entries(d.outcomes).map(([k,v])=>k+' '+v).join(', '))})`).join('<br>') || 'none';
  $('#s-mis').innerHTML = `<h2>Mission atmospheres</h2>
  <p>Numbers from the official challenge text (${link(P.source.split(': ')[1], 'challenge page')}); kilopascals are computed in the pipeline (${esc(P.conversion)}). Earth sea level is ${P.reference.p_psi} psi = ${P.reference.p_kpa} kPa.</p>
  <div class="grid">${P.profiles.map(p => `<div class="card"><b>${esc(p.name)}</b><br>"${esc(p.statement)}"<br>
   oxygen: ${p.o2_max===1 && p.o2_min===1 ? '100%' : '>= '+Math.round(p.o2_min*100)+'%'}<br>pressure: ${p.p_min_psi!==null ? '' : '<= '}${p.p_max_psi} psi = ${p.p_max_kpa} kPa<hr>
   <b>${p.tests_inside_total}</b> of ${P.tests_considered} test rows in the unified table fall inside this envelope.<br><span class="small">${fam(p)}</span><br>
   <span class="src">${p.tests_without_oxygen_or_pressure} rows have no oxygen or no pressure value and cannot be placed. ${p.tests_inside_total ? 'Gravity of the rows inside: '+[...new Set(Object.values(p.tests_inside_by_family).flatMap(d=>d.gravity_levels))].join(', ')+' g; none is at lunar or Martian gravity.' : ''}</span></div>`).join('')}</div>
  <p class="warn">The lunar base and pressurized rover share one envelope in the official text (oxygen likely 30% or greater, pressure 10.2 psi or less), so they show the same count. No test row in the table is at the suit condition (100% oxygen, 4.3 psi): the suit envelope is an evidence gap.</p>
  <h3>Supporting evidence</h3>
  ${D.bre_quote ? `<p>The ACME BRE investigation (PSI-20) states its planned atmospheres: <i>"${esc(D.bre_quote)}"</i> ${link(D.investigations.find(i=>i.id==='PSI-20').psi_url,'PSI-20 record')}. These are planned conditions in the objective text, not results.</p>` : ''}
  <p>Exploration-atmosphere reports in the catalog (cited, not summarised here):</p><ul>${D.atmos_reports.map(r => `<li>${esc(r.title)} (${esc(r.item_id)}), ${link(r.url)}</li>`).join('')}</ul>
  <p class="small">The highest-oxygen microgravity tests in the table are ACME CFI-G: up to ${Math.max(...D.investigations.filter(i=>i.id==='PSI-159').map(i=>parseFloat(i.tests_summary.o2.split(' to ').pop())))*100}% oxygen (official text: "up to 85% oxygen from a spherical burner").</p>`;
}

/* ---------- G4: partial-gravity bounds ---------- */
function renderGrav(){
  const c = D.gravity_counts, n = k => c[k] || {psi:0,outside_psi:0};
  const cell = (r) => r ? `${esc(r.material_or_fuel)}<br>O2 ${esc(r.oxygen_fraction||'?')}, flow ${esc(r.flow_velocity_cm_s||'?')} cm/s<br>outcome: <b>${esc(r.outcome_class)}</b> (${esc(r.outcome_raw)})<br>burn ${esc(r.burn_duration_s||'n/a')} s; spread ${esc(r.spread_rate||'n/a')} ${esc(r.spread_rate_basis||'')}<br><span class="src">${esc(r.source_ref)}</span>${r.alt_value_report ? `<br><span class="src">report differs: ${esc(r.alt_value_report)}</span>`:''}` : nd();
  $('#s-grav').innerHTML = `<h2>Partial gravity: what the evidence bounds</h2>
  <p class="warn">Official text: "there is currently no partial-gravity combustion data in PSI." Microgravity (0 g) and normal-gravity (1 g) results could bound what occurs between. LUCI and FM2 are expected to add lunar-gravity data; ACME E-FIELD Flames mimicked partial gravity with an electric field acting on flame ions (see PSI-22).</p>
  <h3>Rows in the unified table by gravity level</h3>
  <div class="scroll"><table><tr><th>gravity</th><th>from PSI tables (tests and limits)</th><th>outside PSI (transcribed from NTRS reports)</th></tr>
  ${['0','0.165','0.38','1','not stated'].filter(k=>c[k]).map(k => `<tr><td>${k==='0.165'?'0.165 g (lunar)':k==='0.38'?'0.38 g (Mars)':k==='0'?'0 g (microgravity)':k==='1'?'1 g':k}</td><td>${n(k).psi}</td><td>${n(k).outside_psi}</td></tr>`).join('')}</table></div>
  <p><b>Gap:</b> lunar (0.165 g) and Martian (0.38 g) have 0 rows from PSI. The only lunar and Martian rows are transcribed from NTRS reports and are labelled <b>outside PSI, transcribed from NTRS</b>. "limit" rows are flammability-limit entries (oxygen limits) rather than single tests; their outcome is not classified.</p>
  <div class="scroll"><table><tr><th>row</th><th>type</th><th>gravity</th><th>material</th><th>pressure kPa</th><th>limit data / outcome</th><th>source</th></tr>
  ${D.literature.map(r=>`<tr><td>${esc(r.test_id)}</td><td>${esc(r.record_type)}</td><td>${esc(r.gravity_level_g)} g</td><td>${esc(r.material_or_fuel)}</td><td>${esc(r.pressure_kpa||'')}</td><td>${r.record_type==='limit' ? `ULOI ${esc(r.uloi_vol_pct||'n/a')}%, MOC ${esc(r.moc_vol_pct||'n/a')}%, margin vs 1 g ${esc(r.o2_margin_vs_1g_pct||'n/a')}% (${esc(r.limit_criterion||'')})` : esc(r.outcome_class)+' ('+esc(r.outcome_raw)+')'}</td><td class="small">${esc(r.source_ref)}</td></tr>`).join('')}</table></div>
  <h3>0 g and 1 g side by side (Saffire-II samples, PSI-99)</h3>
  <p class="small">Each sample was also tested at 1 g for comparison; rows are paired by <code>pair_id</code>.</p>
  <div class="scroll"><table><tr><th>sample</th><th>0 g (flight)</th><th>1 g (comparison)</th></tr>
  ${D.pairs.map(p => `<tr><td>${esc(p.id)}</td><td>${cell(p['0g'])}</td><td>${cell(p['1g'])}</td></tr>`).join('')}</table></div>`;
}

/* ---------- G5: Earth applications ---------- */
function renderEarth(){
  const L = [['Fireman\'s Air Tanks (spinoff)','https://spinoff.nasa.gov/node/9582'],['Fire Detector (spinoff)','https://spinoff.nasa.gov/node/9407'],['New Technology for the Fire Attire (spinoff)','https://spinoff.nasa.gov/node/9918']];
  $('#s-earth').innerHTML = `<h2>Fire safety on Earth</h2>
  <p>The official challenge text names three application areas for PSI data: fine-water-mist extinguishers developed for the ISS, terrestrial smoke detection, and firefighter gear and protective clothing. NASA lists three spinoff stories as resources:</p>
  <ul>${L.map(([t,u]) => `<li>${link(u,t)}</li>`).join('')}</ul>
  <p class="small muted">Which story covers which area is not stated in the official text, so no mapping is shown here. Related investigations in this explorer: detection (SAME, SAME-R, DAFT) and suppression (FLEX).</p>`;
}

/* ---------- G6: About ---------- */
function renderAbout(){
  const R = [['PSI Data Repository, Combustion Science','https://psi.nasa.gov/physci/repo/search?q=combustion'],['NASA Combustion Science','https://www.nasa.gov/glenn/glenn-expertise-space-exploration/physical-sciences-program/combustion-science/'],
   ['NASA ScienceCasts: The Power of Studying Combustion on the ISS (video, 2018)','https://www.youtube.com/watch?v=W1oXykoz9zg'],['A Researcher\'s Guide to International Space Station Combustion Science (2015)','https://www.nasa.gov/missions/station/a-researchers-guide-to-combustion-science/'],
